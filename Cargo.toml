[package]
authors = ["Sterling DeMille <sterlingdemille+github@gmail.com>"]
name = "encrusted"
version = "1.1.0"
description = "A z-machine (interpreter) for Infocom-era text adventure games"
repository = "https://github.com/demille/encrusted"
readme = "README.md"
license = "MIT"

[[bin]]
name = "encrusted"
path = "src/rust/main.terminal.rs"

[lib]
crate-type = ["cdylib"]
name = "web"
path = "src/rust/main.web.rs"

[profile.release]
lto = true
opt-level = 's'

[dependencies]
base64 = "0.10.1"
enum_primitive = "0.1.1"
rand = "0.8.5"
rand_xorshift = "0.3.0"
serde = "1.0.88"
serde_derive = "1.0.88"
serde_json = "1.0.38"
bitflags = "1.2.1"
unicode-segmentation = "1.7.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
getrandom = { version = "0.2.16", features = ["js"] }
log = "0.4.28"
wasm-bindgen = "0.2.118"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = "2.32.0"
lazy_static = "1.2.0"
regex = "1.1.0"
crossterm = "0.19.0"
